# The compiler line this repository runs `tacplus registry register` with. The
# floor follows the latest released MAJOR.MINOR line, and the looper runs that
# line's latest patch (tacplus-dev/tacplus#161). 2.4 is the first line with
# `register`. This repo has no protos, so there is nothing to build: the file
# names the floor, and tacplus.lock (`tacplus pin`) the exact release and build
# image within it that `just gates` and the build pipeline run.
tacplus: "2.6"
